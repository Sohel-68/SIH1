[project]
name = "geostrata-backend"
version = "1.0.0"
description = "GeoStrata – National 3D ULPIN & Vertical Property Mapping Platform Core API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.3",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "geoalchemy2>=0.16.1",
    "shapely>=2.0.6",
    "alembic>=1.14.0",
    "redis[hiredis]>=5.2.1",
    "pyjwt[crypto]>=2.10.1",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.20",
    "celery>=5.4.0",
    "psycopg2-binary>=2.9.10",
    "httpx>=0.28.1"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4"]
ignore = ["E501"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = [".", ".venv/Lib/site-packages"]

