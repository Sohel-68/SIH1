# ==============================================================================
# GeoStrata: Enterprise Docker Compose Orchestration
# National 3D ULPIN & Vertical Property Mapping Platform
# ==============================================================================

services:
  # -------------------------------------------------------------
  # 1. PostgreSQL 16 + PostGIS 3.4 (With 3D SFCGAL Support)
  # -------------------------------------------------------------
  geostrata-db:
    image: postgis/postgis:16-3.4
    container_name: geostrata_postgres_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geostrata_db}
      POSTGRES_USER: ${POSTGRES_USER:-geostrata_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-GeoStrataSecurePassword2026!}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - geostrata_pg_data:/var/lib/postgresql/data
      - ./docker/postgis/init-extensions.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geostrata_admin} -d ${POSTGRES_DB:-geostrata_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geostrata_network

  # -------------------------------------------------------------
  # 2. Redis 7.2 In-Memory Cache & Session Store
  # -------------------------------------------------------------
  geostrata-redis:
    image: redis:7.2-alpine
    container_name: geostrata_redis_cache
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-RedisGeoStrataSecureKey2026!}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - geostrata_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-RedisGeoStrataSecureKey2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - geostrata_network

  # -------------------------------------------------------------
  # 3. FastAPI Enterprise Backend Application
  # -------------------------------------------------------------
  geostrata-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geostrata_fastapi_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-geostrata_admin}:${POSTGRES_PASSWORD:-GeoStrataSecurePassword2026!}@geostrata-db:5432/${POSTGRES_DB:-geostrata_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-RedisGeoStrataSecureKey2026!}@geostrata-redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-geostrata-enterprise-insecure-secret-key-change-in-production-min-32-chars}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      API_V1_STR: /api/v1
      API_V2_STR: /api/v2
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      geostrata-db:
        condition: service_healthy
      geostrata-redis:
        condition: service_healthy
    networks:
      - geostrata_network

  # -------------------------------------------------------------
  # 4. Next.js 15 Standalone Frontend Application
  # -------------------------------------------------------------
  geostrata-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: geostrata_nextjs_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN:-pk.mock_token_for_development_placeholder}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - geostrata-backend
    networks:
      - geostrata_network

networks:
  geostrata_network:
    name: geostrata_network
    driver: bridge

volumes:
  geostrata_pg_data:
    name: geostrata_pg_data
  geostrata_redis_data:
    name: geostrata_redis_data
